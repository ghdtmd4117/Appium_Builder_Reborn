name: Feature integration patch

on:
  push:
    branches: [ feature/local-tc-and-ai-v2 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/local-tc-and-ai-v2
      - name: Patch integration points
        shell: python
        run: |
          from pathlib import Path

          auto = Path('MainForm/MainFormAutoTab.cs')
          text = auto.read_text(encoding='utf-8')
          start_token = '            btnAiAnalyze.Click += async (_, _) =>\n'
          end_token = '\n        }\n\n        private RoundedPanel CreateAppiumServerControlBar()'
          start = text.index(start_token)
          end = text.index(end_token, start)
          text = text[:start] + '            btnAiAnalyze.Click += async (_, _) => await RunSmartAiAssistantAsync();\n' + text[end:]
          auto.write_text(text, encoding='utf-8')

          shell = Path('MainForm/MainFormShell.cs')
          text = shell.read_text(encoding='utf-8')
          text = text.replace(
              '                Size = new Size(410, 28),\n                Font = Globals.FontHeading,',
              '                Size = new Size(276, 28),\n                Font = Globals.FontHeading,',
              1)
          text = text.replace(
              '                Size = new Size(410, 22),\n                Font = Globals.FontMuted,',
              '                Size = new Size(276, 22),\n                Font = Globals.FontMuted,',
              1)
          anchor = '            var connDivider = new Panel\n'
          insert = '''            var btnLocalTcEntry = CreateModernButton(\n                "로컬 TC",\n                Globals.SurfaceAlt,\n                370,\n                36,\n                134,\n                36,\n                "archive");\n            btnLocalTcEntry.ForeColor = Globals.Accent;\n            btnLocalTcEntry.IconColor = Globals.Accent;\n            btnLocalTcEntry.BorderColor = Globals.Border;\n            btnLocalTcEntry.BorderThickness = 1;\n            btnLocalTcEntry.Click += (_, _) =>\n            {\n                using var form = new LocalTestCaseBuilderForm();\n                form.ShowDialog(this);\n            };\n'''
          if insert not in text:
              text = text.replace(anchor, insert + anchor, 1)

          text = text.replace(
              '                lblProductMeta,\n                connDivider,',
              '                lblProductMeta,\n                btnLocalTcEntry,\n                connDivider,',
              1)

          menu_anchor = '            btnTabAuto = CreateMenuButton("Appium 봇", "appium", 144);\n'
          menu_insert = '''            var btnLocalTc = CreateMenuButton("로컬 TC", "archive", 192);\n            btnLocalTc.Click += (_, _) =>\n            {\n                using var form = new LocalTestCaseBuilderForm();\n                form.ShowDialog(this);\n            };\n'''
          if menu_insert not in text:
              text = text.replace(menu_anchor, menu_anchor + menu_insert, 1)
          text = text.replace(
              '                btnTabUtil,\n                btnTabAuto,\n                navIndicator',
              '                btnTabUtil,\n                btnTabAuto,\n                btnLocalTc,\n                navIndicator',
              1)
          shell.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm/MainFormAutoTab.cs MainForm/MainFormShell.cs
          git diff --cached --quiet && exit 0
          git commit -m "Integrate local TC builder and smart AI planner"
          git push origin HEAD:feature/local-tc-and-ai-v2
