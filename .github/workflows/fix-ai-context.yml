name: Fix AI context
on:
  push:
    branches: [ feature/local-tc-and-ai-v2 ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/local-tc-and-ai-v2
      - shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm/MainFormGemini.cs')
          text = p.read_text(encoding='utf-8')
          old = 'public string CompactText { get; init; } = string.Empty;'
          new = 'public string CompactText { get; set; } = string.Empty;'
          assert old in text
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm/MainFormGemini.cs
          git commit -m "Fix AI UI context construction"
          git push origin HEAD:feature/local-tc-and-ai-v2
