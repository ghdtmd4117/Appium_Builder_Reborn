name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AppiumBuilder.slnx

      - name: Build
        run: dotnet build AppiumBuilder.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/AppiumBuilder.Tests.csproj --configuration Release --no-build

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9'

      - name: Test
        run: python -m pytest Tests/python -q
