name: Fix AI regex
on:
  push:
    branches: [ feature/local-tc-and-ai-v2 ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/local-tc-and-ai-v2
      - shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm/MainFormGemini.cs')
          text = p.read_text(encoding='utf-8')
          old = r'''Match match = Regex.Match(target, @"contains\(@(?:text|content-desc),\s*['\"](?<value>[^'\"]+)['\"]\)", RegexOptions.IgnoreCase);'''
          new = r'''Match match = Regex.Match(target, @"contains\(@(?:text|content-desc),\s*['""](?<value>[^'""]+)['""]\)", RegexOptions.IgnoreCase);'''
          assert old in text, 'target regex not found'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm/MainFormGemini.cs
          git commit -m "Fix AI locator grounding regex"
          git push origin HEAD:feature/local-tc-and-ai-v2
