name: Fix loopback guard
on:
  push:
    branches: [ feature/local-tc-and-ai-v2 ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/local-tc-and-ai-v2
      - shell: python
        run: |
          from pathlib import Path
          p = Path('Core/LocalTestCaseEngine.cs')
          text = p.read_text(encoding='utf-8')
          assert 'Uri.IsLoopback(uri)' in text
          assert 'Uri.IsLoopback(requestUri)' in text
          text = text.replace('Uri.IsLoopback(uri)', 'uri.IsLoopback')
          text = text.replace('Uri.IsLoopback(requestUri)', 'requestUri.IsLoopback')
          p.write_text(text, encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/LocalTestCaseEngine.cs
          git commit -m "Fix local-only endpoint guard compilation"
          git push origin HEAD:feature/local-tc-and-ai-v2
