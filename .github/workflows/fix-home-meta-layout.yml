name: Fix home meta layout
on:
  push:
    branches: [ feature/local-tc-and-ai-v2 ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/local-tc-and-ai-v2
      - shell: python
        run: |
          from pathlib import Path
          p = Path('MainForm/MainFormHomeTab.cs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('root.RowStyles.Add(Abs(136));', 'root.RowStyles.Add(Abs(152));', 1)
          text = text.replace('SetAbsoluteRow(root, 1, 136);', 'SetAbsoluteRow(root, 1, 152);')
          text = text.replace('SetAbsoluteRow(root, 1, narrow ? 390 : 136);', 'SetAbsoluteRow(root, 1, narrow ? 438 : 152);', 1)
          old = '''            grid.RowStyles.Add(Abs(22));\n            grid.RowStyles.Add(Abs(34));\n            grid.RowStyles.Add(Pct(100));\n            var iconBox = new RoundedPanel'''
          new = '''            grid.RowStyles.Add(Abs(22));\n            grid.RowStyles.Add(Abs(34));\n            grid.RowStyles.Add(Abs(50));\n            var iconBox = new RoundedPanel'''
          assert old in text, 'home top card row styles not found'
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainForm/MainFormHomeTab.cs
          git commit -m "Prevent home status metadata clipping"
          git push origin HEAD:feature/local-tc-and-ai-v2
