name: Apply embedded local AI bootstrap
on:
  push:
    branches: [ feature/embedded-local-ai-bootstrap ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/embedded-local-ai-bootstrap
      - name: Apply prepared source patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/embedded-ai.patch
          patch -p0 < /tmp/embedded-ai.patch
          rm -f .github/workflows/apply-embedded-local-ai.yml
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/LocalAiRuntimeManager.cs UI/LocalTestCaseBuilderForm.cs MainForm/MainForm.cs Tests/LocalTestCaseEngineTests.cs .github/workflows/apply-embedded-local-ai.yml
          git commit -m "Embed self-preparing local AI runtime"
          git push origin HEAD:feature/embedded-local-ai-bootstrap
