name: Handoff source package

on:
  push:
    branches:
      - feature/local-tc-and-ai-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source ZIP
        shell: bash
        run: |
          zip -r AppiumBuilder_Reborn_LocalTC_AIPlannerV2.zip . \
            -x '.git/*' \
               '.github/workflows/handoff-package.yml' \
               '*/bin/*' \
               '*/obj/*' \
               '.vs/*'

      - name: Upload handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AppiumBuilder_Reborn_LocalTC_AIPlannerV2
          path: AppiumBuilder_Reborn_LocalTC_AIPlannerV2.zip
          if-no-files-found: error
          retention-days: 1
