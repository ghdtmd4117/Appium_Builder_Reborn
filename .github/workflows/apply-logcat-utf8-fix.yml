name: Apply logcat UTF-8 encoding fix

on:
  push:
    branches:
      - fix/logcat-korean-utf8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/logcat-korean-utf8
      - name: Apply UTF-8 fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('MainForm/MainFormLogTab.cs')
          text = path.read_text(encoding='utf-8')

          old = 'using System.IO;\nusing System.Linq;'
          new = 'using System.IO;\nusing System.Linq;\nusing System.Text;'
          if old not in text:
              raise SystemExit('using insertion point not found')
          text = text.replace(old, new, 1)

          old = '''                            RedirectStandardOutput = true,\n                            RedirectStandardError = true,\n                            CreateNoWindow = true'''
          new = '''                            RedirectStandardOutput = true,\n                            RedirectStandardError = true,\n                            StandardOutputEncoding = new UTF8Encoding(false, true),\n                            StandardErrorEncoding = new UTF8Encoding(false, true),\n                            CreateNoWindow = true'''
          if old not in text:
              raise SystemExit('ProcessStartInfo insertion point not found')
          text = text.replace(old, new, 1)

          old = '                    File.WriteAllText(path, allLogText);'
          new = '                    File.WriteAllText(path, allLogText, new UTF8Encoding(encoderShouldEmitUTF8Identifier: true));'
          if old not in text:
              raise SystemExit('save encoding insertion point not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-logcat-utf8-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm/MainFormLogTab.cs .github/workflows/apply-logcat-utf8-fix.yml
          git commit -m 'Fix Korean logcat UTF-8 decoding and export'
          git push origin HEAD:fix/logcat-korean-utf8
